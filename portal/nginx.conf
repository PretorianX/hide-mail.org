server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Strict CSP for the Send portal: no unsafe-inline scripts, no third-party ad/analytics origins
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* \.map$ {
        return 404;
    }

    location = /admin/portal {
        return 301 /admin/portal/;
    }

    location /admin/portal/ {
        try_files $uri $uri/ /admin/portal/index.html;
    }

    # Container health / direct :3003 checks (public entry is via frontend /admin/portal/)
    location = / {
        default_type text/plain;
        return 200 'ok\n';
    }
}
