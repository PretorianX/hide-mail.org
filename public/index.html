<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var u = new URL(window.location.href);
          var hp = new URLSearchParams(u.hash.replace(/^#/, ''));
          var t = hp.get('handoffToken') || hp.get('handoff_token') || u.searchParams.get('handoffToken') || u.searchParams.get('handoff_token');
          if (t) {
            sessionStorage.setItem('hidemail_handoff_token', t);
            hp.delete('handoffToken');
            hp.delete('handoff_token');
            u.searchParams.delete('handoffToken');
            u.searchParams.delete('handoff_token');
            var nh = hp.toString();
            window.history.replaceState({}, '', u.pathname + u.search + (nh ? '#' + nh : ''));
          }
        } catch (e) {}
      })();
    </script>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7941d" />
    <meta name="description" content="Hide Mail - Your friendly temporary email service. Create disposable email addresses to protect your privacy." />
    <!-- AdSense verification meta tag - Only included in production -->
    <% if (process.env.NODE_ENV === 'production') { %>
    <meta name="google-adsense-account" content="ca-pub-9729692981183751">
    <% } %>
    <!-- iOS PWA support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hide Mail" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Hide Mail</title>
    
    <!-- Google Analytics - Consent-gated, only included in production -->
    <% if (process.env.NODE_ENV === 'production') { %>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window['ga-disable-G-46KBN1JF5T'] = true;
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied'
      });

      (function() {
        var GA_ID = 'G-46KBN1JF5T';
        function hasAnalyticsConsent() {
          try {
            if (window.localStorage.getItem('cookieConsentGiven') !== 'true') return false;
            var prefs = JSON.parse(window.localStorage.getItem('cookiePreferences') || '{}');
            return prefs && prefs.analytics === true;
          } catch (e) {
            return false;
          }
        }
        function loadGtag() {
          if (document.querySelector('script[src*="googletagmanager.com/gtag/js"]')) return;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
          document.head.appendChild(s);
          gtag('js', new Date());
          gtag('config', GA_ID);
        }
        window.__enableAnalyticsConsent = function() {
          window['ga-disable-' + GA_ID] = false;
          gtag('consent', 'update', { analytics_storage: 'granted' });
          loadGtag();
        };
        window.__disableAnalyticsConsent = function() {
          window['ga-disable-' + GA_ID] = true;
          gtag('consent', 'update', { analytics_storage: 'denied' });
        };
        if (hasAnalyticsConsent()) {
          window.__enableAnalyticsConsent();
        }
      })();
    </script>
    <% } %>
    
    <!-- Runtime environment variables will be injected here -->
    <script src="%PUBLIC_URL%/runtime-env.js"></script>
    
    <!-- AdSense configuration script to ensure correct client ID -->
    <% if (process.env.NODE_ENV === 'production') { %>
    <script src="%PUBLIC_URL%/adsense-config.js"></script>
    <% } %>
    
    <!-- AdSense script will be dynamically injected by adsense-config.js -->
    <!-- We no longer include the placeholder script here -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
